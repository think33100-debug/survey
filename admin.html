<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>도전하는 사람들 설문 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F5F3EE;--card:#fff;--ink:#1B2220;--sub:#66706C;--mute:#9AA29E;--line:#E5E1D8;--acc:#2E6B5D;--acc-soft:#E6F0EC;--warm:#D98E2B;--warm-soft:#FBF1E2;--err:#C24A3A;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:15px;color:#1E4A40}.brand i{font-style:normal;color:var(--warm)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:20px;margin:0}
header .sp{flex:1}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.pri{background:var(--acc);color:#fff;box-shadow:none}
a.btn{color:var(--ink)}
.login{max-width:360px;margin:12vh auto 0;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 8px 28px rgba(20,30,25,.07);text-align:center}
.login input{width:100%;text-align:center;font-size:22px;letter-spacing:.4em;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:16px 0 12px;outline:none}
.login input:focus{border-color:var(--acc)}
.login .btn{width:100%;padding:13px}
.err{color:var(--err);font-size:13.5px;min-height:20px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi small{color:var(--sub);font-size:13px}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.warm{background:var(--warm-soft)}
h2{font-size:16px;margin:26px 0 10px;color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;padding:18px 18px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
.card h3{font-size:15px;margin:0 0 2px}
.card .n{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.row{display:grid;grid-template-columns:minmax(0,9em) 1fr 5.6em;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr{height:10px;background:#F1EEE7;border-radius:99px;overflow:hidden}
.row .tr div{height:100%;background:var(--acc);border-radius:99px}
.row .v{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.row .v b{color:var(--ink)}
.avg{font-size:13px;color:var(--sub);margin-top:8px}
.texts{max-height:320px;overflow:auto;margin:0;padding:0;list-style:none}
.texts li{font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.texts li:first-child{border-top:0}
.texts li small{color:var(--mute);margin-left:6px}
.empty{color:var(--mute);font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;border-top:0}
.tbl{overflow:auto}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.days .row{grid-template-columns:5.5em 1fr 5.6em}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="login" id="login">
    <div class="brand">도전하는 <i>사람들</i></div>
    <h1 style="font-size:19px;margin:10px 0 0">설문 관리자</h1>
    <input type="password" id="pw" inputmode="numeric" maxlength="12" placeholder="••••" autocomplete="current-password">
    <button class="btn pri" id="go">들어가기</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
/* ★ index.html과 같은 웹 앱 주소를 붙여 넣으세요 */
const SCRIPT_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA=null, PW='', FILTER='전체';

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5), s=document.createElement('script');
    const t=setTimeout(()=>{clean();rej(new Error('시간 초과'))},20000);
    function clean(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove();}
    window[cb]=d=>{clean();res(d)}; s.onerror=()=>{clean();rej(new Error('연결 실패'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb; document.body.appendChild(s);
  });
}
async function load(){
  const r = await jsonp(`${SCRIPT_URL}?action=stats&pw=${encodeURIComponent(PW)}`);
  if (!r.ok) throw new Error(r.err||'실패');
  DATA = r;
}
$('#go').onclick = login;
$('#pw').onkeydown = e => { if (e.key==='Enter') login(); };
async function login(){
  PW = $('#pw').value.trim(); $('#err').textContent='확인 중…';
  try{ await load(); draw(); }catch(e){ $('#err').textContent=e.message; }
}

/* 머리글 해석 */
const META = ['응답ID','시각','기기','유입','인터뷰 신청'];
function roleOf(r,H){ const v=r[H.indexOf('구분')]||''; return v.startsWith('학생')?'학생':v.startsWith('임상가')?'임상가':v?'기타':''; }

function draw(){
  const H = DATA.main.header, all = DATA.main.rows;
  const rows = FILTER==='전체' ? all : all.filter(r=>roleOf(r,H)===FILTER);
  const cnt = k => all.filter(r=>roleOf(r,H)===k).length;
  const ivCount = DATA.iv.rows.length;

  let h = `<header><span class="brand">도전하는 <i>사람들</i></span><h1>설문 통계</h1><span class="sp"></span>
    <button class="btn" id="csv">CSV 받기</button><a class="btn" href="${esc(DATA.sheetUrl)}" target="_blank" rel="noopener" style="text-decoration:none">시트 열기</a><button class="btn pri" id="re">새로고침</button></header>
  <div class="kpis">
    <div class="kpi"><small>전체 응답</small><b>${all.length}</b></div>
    <div class="kpi"><small>학생</small><b>${cnt('학생')}</b></div>
    <div class="kpi"><small>임상가</small><b>${cnt('임상가')}</b></div>
    <div class="kpi"><small>기타</small><b>${cnt('기타')}</b></div>
    <div class="kpi warm"><small>출시 알림 신청</small><b>${DATA.alertCount}</b></div>
    <div class="kpi warm"><small>전화 미팅 신청</small><b>${ivCount}</b></div>
  </div>
  <div class="tabs">${['전체','학생','임상가','기타'].map(t=>`<button class="${FILTER===t?'on':''}" data-f="${t}">${t}</button>`).join('')}</div>`;

  // 날짜별
  const byDay = {};
  rows.forEach(r=>{ const d=(r[H.indexOf('시각')]||'').slice(0,10); if(d) byDay[d]=(byDay[d]||0)+1; });
  const days = Object.keys(byDay).sort();
  h += `<h2>날짜별 응답</h2><div class="card days">${days.length?bars(days.map(d=>[d.slice(5),byDay[d]]), rows.length):'<p class="empty">아직 응답이 없습니다.</p>'}</div>`;

  // 문항 묶기
  const groups=[]; const seen={};
  H.forEach((col,i)=>{
    if (META.includes(col)) return;
    let key=col, kind='single', opt=null;
    const m = col.match(/^(.+?): (.+)$/);
    if (m && /^[ABC]\d/.test(m[1])){ key=m[1]; opt=m[2]; kind = / \(적은 내용\)$/.test(opt) ? 'multiText' : 'multi'; }
    else if (/\(주관식\)$/.test(col)) kind='text';
    if (!seen[key]){ seen[key]={key,kind:kind==='multiText'?'multi':kind,opts:[],texts:[],idx:i}; groups.push(seen[key]); }
    const g=seen[key];
    if (kind==='multi') g.opts.push([opt,i]);
    else if (kind==='multiText') g.texts.push([opt.replace(/ \(적은 내용\)$/,''),i]);
    else g.col=i, g.kind=kind;
  });

  const sec = {구분:'공통', A:'학생 문항', B:'임상가 문항', C:'공통 문항'};
  let curSec='';
  groups.forEach(g=>{
    const s = g.key==='구분'||g.key==='인터뷰 신청' ? '기본' : sec[g.key[0]]||'기타';
    if (s!==curSec){ if(curSec) h+='</div>'; h+=`<h2>${s}</h2><div class="grid">`; curSec=s; }
    h += card(g, rows);
  });
  if (curSec) h+='</div>';

  // 인터뷰 신청자
  const IH = DATA.iv.header, IR = DATA.iv.rows;
  h += `<h2>전화 미팅 신청자 (${IR.length})</h2><div class="card tbl">`;
  h += IR.length ? `<table><thead><tr>${IH.filter(c=>!['응답ID','신청ID','동의'].includes(c)).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${IR.slice().reverse().map(r=>`<tr>${IH.map((c,i)=>['응답ID','신청ID','동의'].includes(c)?'':`<td>${esc(r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p class="empty">아직 신청자가 없습니다.</p>';
  h += `<p class="note">연락처는 이 화면에 표시하지 않습니다. 구글 시트의 「인터뷰신청」 탭에서 확인하세요.</p></div>`;
  h += `<p class="note">불러온 시각 ${new Date(DATA.at).toLocaleString('ko-KR')}</p>`;

  $('#app').innerHTML = h;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;draw();});
  $('#re').onclick = async ()=>{ $('#re').textContent='불러오는 중…'; try{await load();}catch(e){alert(e.message)} draw(); };
  $('#csv').onclick = ()=>csv(H, rows);
}

function bars(list, base){
  const max = Math.max(1,...list.map(x=>x[1]));
  return list.map(([lb,v])=>`<div class="row"><span class="lb" title="${esc(lb)}">${esc(lb)}</span><span class="tr"><div style="width:${v/max*100}%"></div></span><span class="v"><b>${v}</b>${base?` · ${Math.round(v/base*100)}%`:''}</span></div>`).join('');
}
function card(g, rows){
  const title = g.key.replace(/^[ABC]\d+ /,'').replace(/ \(주관식\)$/,'');
  if (g.kind==='multi'){
    const asked = rows.filter(r=>g.opts.some(([,i])=>r[i]!=='')); const n=asked.length;
    const list = g.opts.map(([o,i])=>[o, asked.filter(r=>r[i]==='1').length]).sort((a,b)=>b[1]-a[1]);
    let h = `<div class="card"><h3>${esc(title)}</h3><p class="n">응답 ${n}명 · 여러 개 선택</p>${n?bars(list,n):'<p class="empty">응답 없음</p>'}`;
    g.texts.forEach(([o,i])=>{ const t=asked.map(r=>r[i]).filter(Boolean); if(t.length) h+=`<p class="n" style="margin:14px 0 6px">「${esc(o)}」에 적은 내용</p><ul class="texts">${t.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; });
    return h+'</div>';
  }
  if (g.kind==='text'){
    const t = rows.map(r=>[r[g.col], r[1]]).filter(x=>x[0]);
    return `<div class="card" style="grid-column:1/-1"><h3>${esc(title)}</h3><p class="n">${t.length}건</p>${t.length?`<ul class="texts">${t.reverse().map(([x,d])=>`<li>${esc(x)}<small>${esc(String(d).slice(5,16))}</small></li>`).join('')}</ul>`:'<p class="empty">아직 없음</p>'}</div>`;
  }
  // 단일 선택 / 척도
  const vals = rows.map(r=>r[g.col]).filter(v=>v!=='');
  const map = {}; vals.forEach(v=>{ const k=v.replace(/^(기타): .*/,'$1'); map[k]=(map[k]||0)+1; });
  let list = Object.entries(map);
  const isScale = list.length && list.every(([k])=>/^[1-5]$/.test(k));
  if (isScale) list = [1,2,3,4,5].map(n=>[String(n), map[n]||0]); else list.sort((a,b)=>b[1]-a[1]);
  let h = `<div class="card"><h3>${esc(title)}</h3><p class="n">응답 ${vals.length}명</p>${vals.length?bars(list,vals.length):'<p class="empty">응답 없음</p>'}`;
  if (isScale && vals.length) h += `<p class="avg">평균 <b>${(vals.reduce((a,b)=>a+Number(b),0)/vals.length).toFixed(2)}</b> / 5</p>`;
  const etc = vals.filter(v=>/^기타: /.test(v)).map(v=>v.slice(4));
  if (etc.length) h += `<p class="n" style="margin:14px 0 6px">「기타」에 적은 내용</p><ul class="texts">${etc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  return h+'</div>';
}
function csv(H, rows){
  const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g,'""')}"` : v;
  const s = '﻿' + [H, ...rows].map(r=>r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));
  a.download = `도전하는사람들_설문_${FILTER}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
</script>
</body>
</html>
