<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도전하는 사람들 설문 — 치료사·의료기사 채용 이야기</title>
<meta name="description" content="학생과 임상가의 채용 경험을 듣는 3분 설문입니다.">
<meta property="og:title" content="도전하는 사람들 설문 — 3분이면 충분해요">
<meta property="og:description" content="의료기사 학생·임상가의 채용 이야기를 들려주세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#1B2220; --sub:#66706C; --mute:#9AA29E;
  --line:#E5E1D8; --acc:#2E6B5D; --acc-2:#3F8A78; --acc-soft:#E6F0EC; --acc-ink:#1E4A40;
  --warm:#D98E2B; --warm-soft:#FBF1E2; --err:#C24A3A;
  --r:18px; --shadow:0 1px 2px rgba(20,30,25,.04),0 8px 28px rgba(20,30,25,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}

/* 위 띠 */
.top{position:sticky;top:0;z-index:5;background:rgba(245,243,238,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top-in{max-width:600px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:15px;color:var(--acc-ink)}
.brand i{font-style:normal;color:var(--warm)}
.step{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line)}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc-2));transition:width .35s ease}

main{max-width:600px;margin:0 auto;padding:20px 16px 120px}
.page{display:none}
.page.anim{animation:in .3s ease}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-soft);
  padding:4px 10px;border-radius:99px;margin:4px 0 10px}
h1{font-size:28px;line-height:1.3;margin:6px 0 12px;letter-spacing:-.02em}
h2{font-size:21px;line-height:1.35;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--sub);margin:0 0 18px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;margin:0 0 14px}
.q-label{font-weight:700;font-size:17px;line-height:1.45;margin:0 0 4px}
.q-label .req{color:var(--warm);margin-left:3px}
.q-help{font-size:13.5px;color:var(--sub);margin:0 0 14px}
.q-err{display:none;color:var(--err);font-size:13px;margin-top:10px}
.card.bad{box-shadow:0 0 0 2px #F0C8C1,var(--shadow)}
.card.bad .q-err{display:block}

/* 보기 */
.opts{display:grid;gap:8px}
.opts.cols2{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:#FBFAF7;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;transition:all .15s ease}
.opt:hover{border-color:#CFC9BC}
.opt .mk{flex:0 0 20px;height:20px;margin-top:2px;border:1.5px solid #C6C0B3;border-radius:50%;display:grid;place-items:center;transition:all .15s}
.opt.multi .mk{border-radius:6px}
.opt .tx{flex:1;min-width:0}
.opt .tx b{font-weight:600}
.opt .tx small{display:block;color:var(--sub);font-size:12.5px;line-height:1.45;margin-top:2px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .mk{background:var(--acc);border-color:var(--acc)}
.opt.sel .mk::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt.dim{opacity:.45}
.etc{display:none;margin:-2px 0 4px}
.etc.on{display:block}
.etc .soft{font-size:12.5px;color:var(--acc);margin:6px 2px 6px}

input[type=text],input[type=tel],textarea,select{width:100%;background:#FBFAF7;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);background:#fff}
textarea{min-height:96px;resize:vertical}
.field{margin:12px 0 0}
.field label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}

/* 척도 */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:#FBFAF7;border-radius:12px;padding:12px 0;font-weight:700;cursor:pointer;transition:all .15s}
.scale button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.scale-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:6px}

/* 소개 */
.hero{padding:26px 22px;background:linear-gradient(160deg,#2E6B5D 0%,#245548 100%);color:#fff;border-radius:22px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hero::before{width:220px;height:220px;right:-70px;top:-80px}
.hero::after{width:120px;height:120px;right:40px;bottom:-60px;background:rgba(217,142,43,.25)}
.hero h1{color:#fff;position:relative}
.hero p{position:relative;color:rgba(255,255,255,.86);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;position:relative}
.chips span{font-size:12.5px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px}
.meta{display:flex;gap:16px;margin:16px 4px 0;color:var(--sub);font-size:13.5px}
.meta b{color:var(--ink)}

.feat{display:grid;gap:10px;margin:14px 0 4px}
.feat div{display:flex;gap:12px;align-items:flex-start}
.feat i{flex:0 0 30px;height:30px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.feat b{display:block;font-size:15px}
.feat small{color:var(--sub);font-size:13px}
.notice{font-size:13px;color:var(--sub);background:#F8F6F1;border-radius:12px;padding:12px 14px;margin-top:14px}

/* 이름 */
.names{display:grid;gap:10px}
.name{text-align:left;cursor:pointer;border:1.5px solid var(--line);background:#FBFAF7;border-radius:16px;padding:16px 16px 14px;transition:all .15s;width:100%}
.name .nm{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.name .nm b{font-size:20px;letter-spacing:-.01em}
.name .nm em{font-style:normal;font-size:12.5px;color:var(--mute)}
.name p{margin:0;font-size:14px;color:var(--sub);line-height:1.55}
.name.sel{border-color:var(--acc);background:var(--acc-soft)}
.name.sel .nm b{color:var(--acc-ink)}

/* 동의 */
.consent{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.consent .doc{font-size:12.8px;color:var(--sub);background:#F8F6F1;padding:12px 14px;line-height:1.6}
.consent .doc b{color:var(--ink)}
.consent .doc ul{margin:6px 0 0;padding-left:18px}
.chk{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14.5px;background:#fff}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:0}

/* 인터뷰 */
details.iv{background:var(--warm-soft);border:1.5px solid #F0D9B5;border-radius:var(--r);margin:18px 0 14px;overflow:hidden}
details.iv summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:10px;font-weight:700}
details.iv summary::-webkit-details-marker{display:none}
details.iv summary .badge{flex:0 0 auto;white-space:nowrap;font-size:11.5px;font-weight:800;background:var(--warm);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.02em}
details.iv summary .arw{margin-left:auto;transition:transform .2s;color:var(--warm)}
details.iv[open] summary .arw{transform:rotate(180deg)}
details.iv .body{padding:0 18px 18px}
.iv-pill{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.iv-pill span{font-size:12.5px;font-weight:700;background:#fff;border:1px solid #F0D9B5;color:#9A5F14;padding:5px 10px;border-radius:99px}
.iv-carry{font-size:12.8px;color:var(--sub);background:#fff;border-radius:12px;padding:10px 12px;margin:10px 0 0}

/* 아래 단추 */
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(245,243,238,0),var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.nav-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.pri{flex:1;background:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-2)}
.btn.pri:disabled{background:#9DB5AE;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}

.done{text-align:center;padding:40px 10px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--acc-soft);display:grid;place-items:center;margin:0 auto 18px}
.done .ok::after{content:"";width:26px;height:14px;border:4px solid var(--acc);border-top:0;border-right:0;transform:rotate(-45deg) translate(2px,-3px)}
.done p{color:var(--sub)}
.foot{text-align:center;font-size:12px;color:var(--mute);margin:28px 0 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (max-width:380px){.opts.cols2{grid-template-columns:1fr}h1{font-size:25px}}

/* 제출 결과 */
.done .ok.bad{background:#FBE9E6}
.done .ok.bad::after{content:"!";border:0;transform:none;width:auto;height:auto;color:var(--err);font-size:34px;font-weight:800}
.spin{width:56px;height:56px;border-radius:50%;border:5px solid var(--acc-soft);border-top-color:var(--acc);margin:6px auto 20px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.done .warm{font-size:17px;line-height:1.7;color:var(--ink);margin:6px 0 12px}
.done .warm b{color:var(--acc-ink)}
.receipt-box{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1.5px dashed #CFC9BC;border-radius:14px;padding:12px 22px;margin-top:10px}
.receipt-box span{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.receipt-box b{font-size:17px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.receipt-box small{font-size:12px;color:var(--mute)}
.receipt{font-size:12.5px;color:var(--mute);margin-top:14px}
.btn.warm{width:100%;margin-top:14px;background:var(--warm);color:#fff}
.btn.warm:disabled{background:#E7C392}
.iv-done{display:flex;gap:14px;align-items:flex-start;background:var(--acc-soft);border-radius:var(--r);padding:18px;margin:6px 0 14px}
.iv-done p{margin:4px 0 0;font-size:14px;color:var(--sub)}
.ok.small{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center}
.ok.small::after{content:"";width:13px;height:7px;border:3px solid var(--acc);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.done{padding:28px 6px 10px}
.chips span.gift{background:var(--warm);color:#fff;font-weight:700}
input.line{width:100%}
.ask-link{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font-size:12px;cursor:pointer}
.ask-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.ask-bg[hidden]{display:none}
.ask-box{background:#fff;border-radius:20px;width:100%;max-width:520px;padding:20px 18px 18px;box-shadow:0 10px 40px rgba(0,0,0,.2);margin-bottom:env(safe-area-inset-bottom)}
.ask-head{display:flex;align-items:center;margin-bottom:10px}.ask-head b{font-size:17px}
.ask-x{margin-left:auto;background:none;border:0;font-size:18px;cursor:pointer;color:var(--sub)}
.ask-note{font-size:12px;color:var(--mute);margin:8px 0 0}
#askErr{display:block}
@media (min-width:600px){.ask-bg{align-items:center}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in"><span class="brand">도전하는 <i>사람들</i></span><span class="step" id="stepTxt"></span></div>
  <div class="bar"><div id="bar"></div></div>
</div>
<main id="app"></main>
<div class="nav"><div class="nav-in">
  <button class="btn ghost" id="prev" type="button">이전</button>
  <button class="btn pri" id="next" type="button">시작하기</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="ask-bg" id="askBg" hidden>
  <div class="ask-box" role="dialog" aria-label="문의하기">
    <div class="ask-head"><b>문의하기</b><button type="button" class="ask-x" onclick="closeAsk()" aria-label="닫기">✕</button></div>
    <div id="askBody">
      <p class="q-help" style="margin:0 0 10px">설문·추첨·전화 미팅 등 궁금한 점을 남겨 주세요. 확인 후 답변드리겠습니다.</p>
      <textarea id="askText" maxlength="1000" placeholder="문의 내용을 적어 주세요"></textarea>
      <div class="field"><label>답변 받으실 연락처 (선택)</label><input type="text" id="askReply" maxlength="60" placeholder="휴대전화 번호 또는 이메일"></div>
      <p class="ask-note">답변 받으실 연락처는 이 문의에 답하는 데만 쓰고, 답변 후 파기합니다.</p>
      <p class="q-err" id="askErr"></p>
      <button type="button" class="btn pri" id="askSend" style="width:100%;margin-top:8px">보내기</button>
    </div>
  </div>
</div>

<script>
/* ★ Apps Script 배포 후 받은 웹 앱 주소를 여기에 붙여 넣으세요 */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGBmsVgM05Vu7_9bTULCsHDBaL3HA7xpUG2kaXxGtbZ8ZtlccuJVapjD5LPcRMb6fR/exec';

/* ───────── 보기 목록 ───────── */
const DEPTS = ['물리치료','작업치료','임상병리','방사선','치위생','치기공','언어치료(재활)','안경광학','보건의료정보',{t:'기타',input:'학과를 적어 주세요'}];
const JOBS  = ['물리치료사','작업치료사','임상병리사','방사선사','치과위생사','치과기공사','언어재활사','안경사','보건의료정보관리사',{t:'기타',input:'직군을 적어 주세요'}];
const ORG_PUBLIC = {t:'공공기관 및 소속 병원', sub:'예: 한국보훈복지의료공단, 근로복지공단, 국민건강보험공단, 도로교통공단, 지방의료원 등'};
const ORGS_BASE = ['상급종합·대학병원','종합병원',ORG_PUBLIC,{t:'국공립병원',sub:'국립·시립·도립 등'},'재활병원','요양병원','한방병원','의원·클리닉','보건소·치매안심센터','복지관·발달센터','연구·교육·기업'];
const PATHS = ['학교 게시판·교수님','선배·동기','카톡 오픈채팅','인스타·유튜브 등 SNS','직군 카페·커뮤니티',
  {t:'채용 사이트',input:'어떤 사이트를 이용하셨나요?',soft:'부담 갖지 마시고 편하게 적어 주세요. 기억나는 만큼만 괜찮아요.'},
  '병원 홈페이지','공공기관 채용 사이트','협회 홈페이지',
  {t:'기타',input:'어디서 찾으셨나요?',soft:'편하게 적어 주세요.'}];
const PAINS = ['공고가 여기저기 흩어져 있어요','연봉을 알 수 없어요','업무 강도를 알 수 없어요','마감을 자주 놓쳐요','내 직군 공고를 찾기 어려워요',{t:'기타',input:'편하게 적어 주세요'}];
const FEATS = ['전국 병원 채용공고 실시간 업데이트','병원 후기',
  {t:'익명 커뮤니티', disp:()=> roleShort()==='학생' ? '익명 학생 커뮤니티' : '직군별 익명 커뮤니티'},
  '청년정책·지원 정보','학회 및 개인 교육 모음과 후기','병원별 인원 및 업무 강도 예측','내 연봉을 남들과 비교하기'];
const NAMES = [
  {t:'라포', en:'Rapport', d:'치료는 신뢰에서 시작합니다. 환자와 치료사, 선배와 후배, 동료 사이에 쌓이는 믿음을 담았습니다. 치료사라면 학교에서 가장 먼저 배우는 말이기도 합니다.'},
  {t:'손잡', en:'', d:'「손을 잡다」에서 왔습니다. 치료사의 손이 환자의 일상을 붙잡아 주듯, 사람과 일자리를 이어 준다는 뜻입니다.'},
  {t:'핸즈온', en:'Hands-on', d:'직접 손으로 하는 일. 책상이 아니라 현장에서 일하는 사람들을 위한 정보라는 뜻입니다.'},
  {t:'펄스', en:'Pulse', d:'맥박. 채용 시장의 흐름을 가장 먼저 짚어 드린다는 뜻입니다.'},
  {t:'핸즈워드', en:'Hands + Ward', d:'손과 병동. 병동에서 일하는 손들이 모이는 곳이라는 뜻입니다.'}
];

/* ───────── 문항 ───────── */
const Q = {
  nick:{col:'닉네임',type:'line',label:'닉네임을 적어 주세요',help:'실명이 아니어도 괜찮아요. 비워 두셔도 됩니다.',ph:'예: 재활하는 곰'},

function render(anim=true){
  const f = flow(), key = f[S.idx], pg = P[key];
  let h = '';
  if (pg.kind==='intro') h = introHTML();
  else if (pg.kind==='done') h = doneHTML();
  else {
    h += `<span class="sec-tag">${pg.tag}</span><h2>${pg.title}</h2>${leadFor(key)?`<p class="lead">${leadFor(key)}</p>`:'<div style="height:14px"></div>'}`;
    if (pg.kind==='feat') h += featHTML();
    pg.qs.forEach(id => { if (vis(id)) h += qHTML(id); });
    if (pg.kind==='alert' && wantsContact()) h += alertHTML();
    h += '<p class="foot">도전하는 사람들 · <button type="button" class="ask-link" onclick="openAsk()">문의하기</button></p>';
  }
  $('#app').innerHTML = `<section class="page on${anim?' anim':''}">${h}</section>`;
  const total = f.length - 2, cur = Math.min(Math.max(S.idx-1,0), total);
  $('#bar').style.width = (pg.kind==='done' ? 100 : (cur/total)*100) + '%';
  $('#stepTxt').textContent = (pg.kind==='intro'||pg.kind==='done') ? '' : `${S.idx} / ${total}`;
  $('#prev').style.display = (S.idx===0) ? 'none' : '';

  $('.nav').style.display = pg.kind==='done' ? 'none' : '';
  bind();
}

function qHTML(id){
  const q = Q[id];
  let h = `<div class="card" data-q="${id}"><p class="q-label">${q.label}${q.req?'<span class="req">*</span>':''}</p>`;
  if (q.help) h += `<p class="q-help">${q.help}</p>`; else h += `<div style="height:10px"></div>`;
  if (q.type==='single' || q.type==='multi'){
    const multi = q.type==='multi';
    const sel = multi ? (S.ans[id]||[]) : [S.ans[id]];
    const full = multi && q.max && sel.length>=q.max;
    h += `<div class="opts${q.cols?' cols2':''}">`;
    q.opts.map(ot).forEach(o => {
      const on = sel.includes(o.t);
      h += `<button type="button" class="opt${multi?' multi':''}${on?' sel':''}${full&&!on?' dim':''}" data-v="${esc(o.t)}"><span class="mk"></span><span class="tx"><b>${esc(o.disp?o.disp():o.t)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</span></button>`;
      if (o.input) h += `<div class="etc${on?' on':''}" style="grid-column:1/-1" data-etc="${esc(o.t)}">${o.soft?`<p class="soft">${esc(o.soft)}</p>`:''}<input type="text" maxlength="200" placeholder="${esc(o.input)}" value="${esc(S.etc[id+'|'+o.t]||'')}"></div>`;
    });
    h += `</div>`;
  } else if (q.type==='scale'){
    h += `<div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}" class="${S.ans[id]==n?'sel':''}">${n}</button>`).join('')}</div><div class="scale-cap"><span>${q.lo}</span><span>${q.hi}</span></div>`;
  } else if (q.type==='line'){
    h += `<input type="text" class="line" maxlength="30" placeholder="${esc(q.ph||'')}" value="${esc(S.ans[id]||'')}">`;
  } else if (q.type==='text'){
    h += `<textarea maxlength="1000" placeholder="편하게 적어 주세요">${esc(S.ans[id]||'')}</textarea>`;
  } else if (q.type==='name'){
    h += `<div class="names">${NAMES.map(n=>`<button type="button" class="name${S.ans[id]===n.t?' sel':''}" data-v="${n.t}"><div class="nm"><b>${n.t}</b>${n.en?`<em>${n.en}</em>`:''}</div><p>${n.d}</p></button>`).join('')}</div>`;
  }
  h += `<p class="q-err">답을 골라 주세요.</p></div>`;
  return h;
}

  return `<div class="card" data-q="alertBox"><p class="q-label">연락받으실 번호를 남겨 주세요</p>
    <p class="q-help">${[rel?'출시 소식':'' , coffee?'커피 추첨 결과':''].filter(Boolean).join('과 ')}를 이 번호로 보내 드려요.</p>
    ${coffee?`<div class="notice" style="margin:0 0 4px"><b>커피 추첨 안내</b><br>· 기간: 11월 20일까지 응답하신 분 중<br>· 방법: 연락처를 남겨 주신 분 중 무작위 30명<br>· 발표: 11월 21일, 개별 문자로 발송<br>· 조건: 1인 1회, 중복 응답은 추첨에서 제외<br>· 운영: 주식회사 빈틈 · 문의는 화면 아래 「문의하기」</div>`:''}
    <div class="field"><label>닉네임</label><input type="text" data-a="nick" maxlength="30" placeholder="예: 재활하는 곰" value="${esc(S.alert.nick||S.ans.nick||'')}"></div>
    <div class="field"><label>휴대전화 번호</label><input type="tel" data-a="phone" inputmode="numeric" maxlength="13" placeholder="010-0000-0000" value="${esc(S.alert.phone)}"></div>
    ${consentHTML('alert')}<p class="q-err" id="alertErr"></p></div>`;
}

/* 제출 완료 화면 */
function doneHTML(){
  const st = S.send.state;
  let h = '';
  if (st==='sending'){
    h += `<div class="done"><div class="spin"></div><h2>보내는 중이에요</h2><p>잠시만 기다려 주세요. 창을 닫지 말아 주세요.</p></div>`;
  } else if (st==='fail'){
    h += `<div class="done"><div class="ok bad"></div><h2>제출이 아직 확인되지 않았어요</h2>
      <p>인터넷 연결이 잠깐 끊겼을 수 있어요. 적어 주신 답은 그대로 남아 있으니 아래 단추를 눌러 다시 보내 주세요.</p>
      <button class="btn pri" id="retry" type="button" style="width:100%;margin-top:8px">다시 보내기</button>
      <p class="receipt">접수번호 <b>${S.id}</b></p></div>`;
  } else {
    h += `<div class="done"><div class="ok"></div>
      <h2>제출이 완료되었습니다</h2>
      <p class="warm">소중한 시간 내어 주셔서 정말 감사합니다.<br>여러분 덕분에 <b>의료기사를 위한 앱</b>에<br>한 걸음 더 가까워졌어요.</p>
      <p>보내 주신 이야기 하나하나 꼼꼼히 읽고, 현장에서 정말 쓸모 있는 앱으로 만들겠습니다.${S.ans.C5==='네, 받을게요'&&S.alert.ok?'<br>출시되면 가장 먼저 문자로 알려 드릴게요.':''}${S.ans.C5b==='네, 응모할게요'&&S.alert.ok?'<br>커피 추첨 결과는 11월 21일에 문자로 알려 드릴게요.':''}</p>
      <div class="receipt-box"><span>접수 확인</span><b>${S.id}</b><small>${esc(S.send.at)} 접수</small></div>
      </div>`;
    h += ivHTML();
  }
  h += `<p class="foot">도전하는 사람들 · <button type="button" class="ask-link" onclick="openAsk()">문의하기</button></p>`;
  return h;
}
function ivHTML(){
  if (S.iv.state==='ok'){
    return `<div class="iv-done"><div class="ok small"></div><div><b>전화 미팅 신청이 접수되었습니다</b><p>신청해 주셔서 감사합니다. 검토 후 선정된 분께 개별로 연락드리겠습니다.</p></div></div>`;
  }
  const sending = S.iv.state==='sending';
  return `<details class="iv" ${S.iv.want||S.iv.state?'open':''}><summary><span class="badge">모집</span>전화 미팅에 참여해 주실 분을 찾고 있습니다<span class="arw">▾</span></summary>
    <div class="body">
      <div class="iv-pill"><span>전화 미팅</span><span>30분 내외</span><span>사례비 1만 원</span></div>
      <p style="margin:0 0 6px;font-size:14.5px">앱을 더 잘 만들기 위해 현장의 이야기를 직접 듣고 싶습니다. 지금 겪고 계신 상황과 채용 정보를 찾을 때의 경험을 전화로 편하게 여쭤보려고 합니다.</p>
      <p style="margin:0;font-size:14.5px">관심 있으신 분은 아래 신청서를 보내 주세요. 검토 후 선정된 분께 개별로 연락드리겠습니다.</p>
      <div class="field"><label>닉네임</label><input type="text" data-i="nick" maxlength="30" placeholder="예: 재활하는 곰" value="${esc(S.iv.nick||S.alert.nick||S.ans.nick||'')}"></div>
      <div class="field"><label>휴대전화 번호</label><input type="tel" data-i="phone" inputmode="numeric" maxlength="13" placeholder="010-0000-0000" value="${esc(S.iv.phone||S.alert.phone)}"></div>
      <p class="iv-carry">${roleShort()==='기타'?'지금 상황':'직군·'+(roleShort()==='학생'?'학년':'연차')} 등은 설문에 답해 주신 내용으로 함께 전달돼요. 다시 적지 않으셔도 됩니다.</p>
      ${consentHTML('iv')}
      <p class="q-err" id="ivErr" style="margin-top:10px;${S.iv.state==='fail'?'display:block':''}">${S.iv.state==='fail'?'신청이 아직 확인되지 않았어요. 다시 눌러 주세요.':''}</p>
      <button class="btn warm" id="ivSend" type="button" ${sending?'disabled':''}>${sending?'보내는 중…':S.iv.state==='fail'?'다시 신청하기':'전화 미팅 신청하기'}</button>
    </div></details>`;
}

/* ───────── 동작 ───────── */
function syncCard(card, id){
  const q = Q[id];
  const sel = q.type==='multi' ? (S.ans[id]||[]) : [S.ans[id]];
  const full = q.type==='multi' && q.max && sel.length>=q.max;
  card.querySelectorAll('.opt').forEach(b => {
    const on = sel.includes(b.dataset.v);
    b.classList.toggle('sel', on); b.classList.toggle('dim', !!full && !on);
  });
  card.querySelectorAll('.etc').forEach(e => e.classList.toggle('on', sel.includes(e.dataset.etc)));
}
function bind(){
  document.querySelectorAll('[data-q]').forEach(card => {
    const id = card.dataset.q, q = Q[id];
    if (!q) return;
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (q.type==='single'){ S.ans[id] = v; }
      else {
        const arr = S.ans[id] || (S.ans[id]=[]);
        const i = arr.indexOf(v);
        if (i>=0) arr.splice(i,1);
        else { if (q.max && arr.length>=q.max){ toast(`최대 ${q.max}개까지 고를 수 있어요`); return; } arr.push(v); }
      }
      card.classList.remove('bad');
      if (DEPENDS[id]){ const y=window.scrollY; render(false); window.scrollTo(0,y); }
      else syncCard(card, id);
      const etc = (DEPENDS[id] ? document.querySelector(`[data-q="${id}"]`) : card).querySelector(`.etc.on[data-etc="${CSS.escape(v)}"] input`);
      if (etc && !etc.value) etc.focus({preventScroll:true});
    });
    card.querySelectorAll('.etc input').forEach(inp => inp.oninput = () => { S.etc[id+'|'+inp.closest('.etc').dataset.etc] = inp.value; });
    card.querySelectorAll('.scale button').forEach(b => b.onclick = () => { S.ans[id] = Number(b.dataset.v); card.classList.remove('bad'); card.querySelectorAll('.scale button').forEach(x=>x.classList.toggle('sel',x===b)); });
    card.querySelectorAll('textarea, input.line').forEach(t => t.oninput = () => { S.ans[id] = t.value; });
    card.querySelectorAll('.name').forEach(b => b.onclick = () => { S.ans[id] = b.dataset.v; card.classList.remove('bad'); card.querySelectorAll('.name').forEach(x=>x.classList.toggle('sel',x===b)); });
  });
  document.querySelectorAll('[data-a]').forEach(i => i.oninput = () => { S.alert[i.dataset.a] = i.dataset.a==='phone' ? fmtPhone(i) : i.value; const b=document.querySelector('[data-q="alertBox"]'); if(b) b.classList.remove('bad'); });
  document.querySelectorAll('[data-i]').forEach(i => i.oninput = () => { S.iv[i.dataset.i] = i.dataset.i==='phone' ? fmtPhone(i) : i.value; const e=$('#ivErr'); if(e) e.style.display='none'; });
  document.querySelectorAll('[data-consent]').forEach(c => c.onchange = () => { (c.dataset.consent==='alert'?S.alert:S.iv).ok = c.checked; if(c.dataset.consent==='alert'){ const b=document.querySelector('[data-q="alertBox"]'); if(b) b.classList.remove('bad'); } const e=$('#ivErr'); if(e && c.dataset.consent==='iv') e.style.display='none'; });
  const det = document.querySelector('details.iv');
  if (det) det.ontoggle = () => { if (det.open){ S.iv.want = true; if(!S.iv.nick) S.iv.nick=S.alert.nick||S.ans.nick||''; if(!S.iv.phone) S.iv.phone=S.alert.phone; } };
  const ivb = $('#ivSend'); if (ivb) ivb.onclick = sendIv;
  const rt = $('#retry'); if (rt) rt.onclick = send;
}
function fmtPhone(inp){
  const d = inp.value.replace(/\D/g,'').slice(0,11);
  const v = d.length<4 ? d : d.length<8 ? d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
  inp.value = v; return v;
}
const phoneOk = p => /^01[016789]-?\d{3,4}-?\d{4}$/.test(p||'');

function check(){
  const key = flow()[S.idx], pg = P[key];
  if (!pg.qs) return true;
  let first = null;
  pg.qs.forEach(id => {
    const q = Q[id]; if (!vis(id) || !q.req) return;
    const v = S.ans[id];
    let ok = q.type==='multi' ? (v && v.length) : (v!==undefined && v!=='');
    let etcMiss = false;
    if (ok && (q.type==='single'||q.type==='multi')){
      const chosen = q.type==='single' ? [v] : v;
      q.opts.map(ot).forEach(o => { if (o.input && o.t==='기타' && chosen.includes(o.t) && !(S.etc[id+'|'+o.t]||'').trim()) { ok = false; etcMiss = true; } });
    }
    const card = document.querySelector(`[data-q="${id}"]`);
    if (!ok){ card.classList.add('bad'); card.querySelector('.q-err').textContent = etcMiss?'「기타」 내용을 적어 주세요.':'답을 골라 주세요.'; first = first||card; }
  });
  if (key==='C_2' && wantsContact()){
    const box = document.querySelector('[data-q="alertBox"]'), e = $('#alertErr');
    let msg = '';
    if (!phoneOk(S.alert.phone)) msg='휴대전화 번호를 확인해 주세요.';
    else if (!S.alert.ok) msg='번호를 남기시려면 개인정보 동의가 필요해요. 원하지 않으시면 위에서 「괜찮아요」를 골라 주세요.';
    if (msg){ box.classList.add('bad'); e.textContent=msg; first=first||box; } else box.classList.remove('bad');
  }
  if (first){ first.scrollIntoView({behavior:'smooth',block:'center'}); return false; }
  return true;
}

/* ───────── 보내기 ───────── */
function val(id){
  const q=Q[id]; if (!vis(id)) return '';
  const v=S.ans[id]; if (v===undefined) return '';
  if (id==='role' && v.startsWith('임상가')) return '임상가';
  if (q.type==='single'){ const e=S.etc[id+'|'+v]; return e&&e.trim() ? `${v}: ${e.trim()}` : v; }
  if (q.type==='multi') return v.map(x=>{ const e=S.etc[id+'|'+x]; return e&&e.trim()?`${x}(${e.trim()})`:x; }).join(', ');
  return v;
}
function asked(id){
  if (!vis(id)) return false;
  if (id[0]==='A') return roleShort()==='학생';
  if (id[0]==='B') return roleShort()==='임상가';
  return true;
}
function buildMain(){
  const pairs = [['응답ID',S.id],['시각',nowKST()]];
  Object.keys(Q).forEach(id => {
    const q=Q[id], on=asked(id);
    if (q.type==='multi'){
      const sel = S.ans[id]||[];
      q.opts.map(ot).forEach(o => {
        pairs.push([`${q.col}: ${o.t}`, on ? (sel.includes(o.t)?1:0) : '']);
        if (o.input) pairs.push([`${q.col}: ${o.t} (적은 내용)`, on && sel.includes(o.t) ? (S.etc[id+'|'+o.t]||'').trim() : '']);
      });
    } else pairs.push([q.col, on ? val(id) : '']);
  });
  const sec = S.t0 ? Math.round((Date.now()-S.t0)/1000) : '';
  pairs.push(['소요(초)', sec]);
  pairs.push(['응답 품질', sec!=='' && sec<30 ? '확인 필요(30초 미만)' : '정상']);
  pairs.push(['기기', /Mobi|Android|iPhone/i.test(navigator.userAgent) ? '모바일' : 'PC']);
  pairs.push(['유입', new URLSearchParams(location.search).get('from') || '']);
  return pairs;
}
function payload(){
  const d = { kind:'main', id:S.id, main:buildMain() };
  if (wantsContact() && S.alert.ok) d.alert = [['시각',nowKST()],['응답ID',S.id],['닉네임',(S.alert.nick||S.ans.nick||'').trim()],['연락처',S.alert.phone],['구분',roleShort()],
    ['출시 알림', S.ans.C5==='네, 받을게요'?'예':'아니오'],['커피 추첨', S.ans.C5b==='네, 응모할게요'?'예':'아니오'],['동의','예']];
  return d;
}
function ivPayload(){
  const r = roleShort();
  return { kind:'iv', id:S.iv.id, iv:[['시각',nowKST()],['신청ID',S.iv.id],['응답ID',S.id],['닉네임',S.iv.nick.trim()],['연락처',S.iv.phone],['구분',r],
    ['직군·학과', r==='학생' ? val('A3') : r==='임상가' ? val('B1') : val('role')],
    ['학년·연차', r==='학생' ? val('A2') : r==='임상가' ? val('B2') : ''],
    ['근무 기관', r==='임상가' ? val('B3') : ''],
    ['방식','전화 미팅'],['동의','예']] };
}
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5), s=document.createElement('script');
    const t=setTimeout(()=>{clean();rej(new Error('timeout'))},12000);
    function clean(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove();}
    window[cb]=d=>{clean();res(d)};
    s.onerror=()=>{clean();rej(new Error('net'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
/* 보내고 → 시트에 실제로 들어갔는지 확인될 때까지 묻기 (최대 약 40초, 중복은 서버가 막음) */
async function postAndConfirm(body, kind, id){
  const waits = [1500,2000,3000,4000,5000,6000,8000];
  for (let attempt=0; attempt<2; attempt++){
    try{ await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}); }catch(e){}
    for (const w of (attempt ? waits.slice(2) : waits.slice(0,5))){
      await sleep(w);
      try{ const r = await jsonp(`${SCRIPT_URL}?action=check&kind=${kind}&id=${encodeURIComponent(id)}`); if (r && r.found) return true; }catch(e){}
    }
  }
  return false;
}
async function send(){
  S.send.state='sending'; S.idx = flow().length-1; render(); window.scrollTo(0,0);
  const ok = await postAndConfirm(JSON.stringify(payload()), 'main', S.id);
  S.send.state = ok ? 'ok' : 'fail'; S.send.at = nowKST();
  render(); window.scrollTo(0,0);
}
async function sendIv(){
  const e = $('#ivErr'); let msg='';
  if (!(S.iv.nick||'').trim()) msg='닉네임을 적어 주세요.';
  else if (!phoneOk(S.iv.phone)) msg='휴대전화 번호를 확인해 주세요.';
  else if (!S.iv.ok) msg='전화 미팅 신청에는 개인정보 동의가 필요해요.';
  if (msg){ e.textContent=msg; e.style.display='block'; return; }
  if (!S.iv.id) S.iv.id = 'I'+S.id.slice(1);
  S.iv.state='sending'; render(false);
  const ok = await postAndConfirm(JSON.stringify(ivPayload()), 'iv', S.iv.id);
  S.iv.state = ok ? 'ok' : 'fail'; render(false);
  const box = document.querySelector('.iv-done, details.iv'); if (box) box.scrollIntoView({behavior:'smooth',block:'center'});
}

$('#next').onclick = () => {
  const f=flow();
  if (!check()) return;
  if (f[S.idx]==='C_3'){ send(); return; }
  if (f[S.idx]==='intro' && !S.t0) S.t0 = Date.now();
  S.idx = Math.min(S.idx+1, f.length-1); render(); window.scrollTo(0,0);
};
/* 문의하기 */
function openAsk(){ $('#askBg').hidden=false; setTimeout(()=>$('#askText').focus(),50); }
function closeAsk(){ $('#askBg').hidden=true; }
$('#askBg').onclick = e => { if (e.target.id==='askBg') closeAsk(); };
$('#askText').oninput = () => { $('#askErr').textContent=''; };
$('#askSend').onclick = async () => {
  const text = $('#askText').value.trim(), reply = $('#askReply').value.trim(), err = $('#askErr');
  if (text.length < 2){ err.textContent='문의 내용을 적어 주세요.'; return; }
  err.textContent=''; const b=$('#askSend'); b.disabled=true; b.textContent='보내는 중…';
  const id = 'Q'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
  const body = JSON.stringify({kind:'ask', id, ask:[['시각',nowKST()],['문의ID',id],['응답ID',S.id],['닉네임',S.ans.nick||''],['내용',text],['답변 연락처',reply]]});
  const ok = await postAndConfirm(body,'ask',id);
  if (ok){ $('#askBody').innerHTML='<p style="margin:6px 0 4px;font-weight:700">문의가 접수되었습니다</p><p class="q-help" style="margin:0">확인 후 답변드리겠습니다. 감사합니다.</p><button type="button" class="btn ghost" style="width:100%;margin-top:14px" onclick="closeAsk()">닫기</button>'; }
  else { b.disabled=false; b.textContent='다시 보내기'; err.textContent='전송이 확인되지 않았어요. 잠시 후 다시 눌러 주세요.'; }
};
$('#prev').onclick = () => { S.idx = Math.max(S.idx-1,0); render(); window.scrollTo(0,0); };
window.addEventListener('beforeunload', e => { if (S.send.state==='sending' || S.iv.state==='sending'){ e.preventDefault(); e.returnValue=''; } });
render();
</script>
</body>
</html>
